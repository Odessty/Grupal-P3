<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Préstamos de Biblioteca</title>
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

    <div class="container my-4">
        <h1 class="text-center mb-4 text-primary fw-bold">Sistema de Préstamos de Biblioteca</h1>

        <!-- Tarjeta de Resumen (Local Storage) -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="card-title mb-0">Resumen de Actividad</h5>
            </div>
            <div class="card-body">
                <div class="row text-center g-3">
                    <div class="col-md-3 col-6">
                        <div class="border rounded p-2 bg-light">
                            <small class="text-muted d-block">Préstamos registrados</small>
                            <span id="totalPrestamos" class="fs-4 fw-bold text-dark">0</span>
                        </div>
                    </div>
                    <div class="col-md-3 col-6">
                        <div class="border rounded p-2 bg-light">
                            <small class="text-muted d-block">Ejemplares prestados</small>
                            <span id="totalEjemplares" class="fs-4 fw-bold text-dark">0</span>
                        </div>
                    </div>
                    <div class="col-md-3 col-6">
                        <div class="border rounded p-2 bg-light">
                            <small class="text-muted d-block">Último libro</small>
                            <span id="ultimoLibro" class="fs-6 fw-bold text-dark">Ninguno</span>
                        </div>
                    </div>
                    <div class="col-md-3 col-6">
                        <div class="border rounded p-2 bg-light">
                            <small class="text-muted d-block">Último estudiante</small>
                            <span id="ultimoEstudiante" class="fs-6 fw-bold text-dark">Ninguno</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Formulario de Registro -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-secondary text-white">
                <h5 class="card-title mb-0">Registrar Nuevo Préstamo</h5>
            </div>
            <div class="card-body">
                
                <!-- Alerta de validaciones de Bootstrap -->
                <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

                <form id="loanForm">
                    <div class="mb-3">
                        <label for="estudiante" class="form-label font-weight-bold">Nombre del Estudiante:</label>
                        <input type="text" id="estudiante" class="form-control" placeholder="Ej. María López">
                    </div>

                    <div class="mb-3">
                        <label for="selectLibros" class="form-label">Seleccionar Libro:</label>
                        <select id="selectLibros" class="form-select">
                            <option value="">Cargando libros...</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="cantidad" class="form-label">Cantidad de Ejemplares:</label>
                        <input type="number" id="cantidad" class="form-control" min="1" placeholder="Ej. 1">
                    </div>

                    <button type="submit" id="btnRegistrar" class="btn btn-success w-100 fw-bold">Registrar préstamo</button>
                </form>
            </div>
        </div>

        <!-- Tabla de Préstamos Registrados -->
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h5 class="card-title mb-0">Préstamos Realizados en la Sesión</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0" id="tablaPrestamos">
                        <thead class="table-light">
                            <tr>
                                <th>Código</th>
                                <th>Libro</th>
                                <th>Estudiante</th>
                                <th>Cantidad</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyPrestamos">
                            <!-- Filas dinámicas -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Script compilado desde app.ts -->
    <script src="app.js"></script>
</body>
</html>
